name: 方案与功能讨论
description: 讨论文档、MCP、Codex 插件和社区流程的改进方向
title: '讨论：'
body:
  - type: markdown
    attributes:
      value: |
        请先说明真实使用场景和要解决的问题。可复现故障请使用 Issue Form，安全问题请使用 Security Advisories。
  - type: textarea
    id: context
    attributes:
      label: 背景与使用场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: 兼容性与取舍
      description: 请说明对现有文档、静态构建、MCP 或社区流程的影响。
